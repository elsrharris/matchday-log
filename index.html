<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D428A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matchday Log">
<title>Matchday Log – Leeds United</title>
<style>
:root{--blue:#1D428A;--blue-d:#14306a;--yellow:#FFCD00;--bg:#f3f5f9;--card:#fff;--ink:#16203a;--muted:#6b7590;--line:#e1e5ee;--win:#1f9d55;--draw:#b98d00;--loss:#d64545;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom));line-height:1.4}
header{background:var(--blue);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--yellow)}
header .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px}
header .ball{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
header h1{margin:0;font-size:1.1rem;line-height:1.1}
header small{opacity:.8;font-size:.78rem}
header .pill{margin-left:auto;flex:none;font-size:.72rem;font-weight:700;text-decoration:none;color:var(--blue);background:var(--yellow);border-radius:20px;padding:5px 10px;white-space:nowrap}
header .pill.ok{background:rgba(255,255,255,.15);color:#fff}
header .pill.warn{background:#fff;color:var(--blue)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:1px solid #c6cbd6;padding:12px}
.gbtn b{font:800 1.05rem system-ui;color:#4285F4}
details.alt summary{cursor:pointer;color:var(--blue);font-size:.85rem;margin-top:12px}
.fres{max-height:420px;overflow:auto;margin-top:8px;border-top:1px solid var(--line)}
.fx{display:flex;align-items:center;gap:10px;width:100%;background:none;color:var(--ink);font-weight:400;padding:9px 2px;border-bottom:1px solid #f0f2f7;border-radius:0;text-align:left}
.fx:active{background:#f3f5f9}
.fx .mid{flex:1;min-width:0}.fx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .sc{font-weight:800;color:var(--blue);flex:none;font-variant-numeric:tabular-nums}
.fx .badge{width:28px;height:28px;font-size:.8rem}
.fx .done{font-size:.68rem;font-weight:700;color:var(--win);flex:none}
.flash{background:#e7f6ec;border:1px solid #9fd8b4;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
.finder .grid{gap:0 8px}
details.fd > summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:.95rem;list-style:none}
details.fd > summary::before{content:'▸ '}details.fd[open] > summary::before{content:'▾ '}
.who-box{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
main{max-width:780px;margin:0 auto;padding:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:780px}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;padding:3px 0}
nav.tabs a .i{display:block;font-size:1.25rem;line-height:1.3}
nav.tabs a.on{color:var(--blue);font-weight:700}
nav.tabs a.add .i{background:var(--blue);color:var(--yellow);width:42px;height:42px;line-height:42px;border-radius:50%;margin:-14px auto 0;font-size:1.5rem;box-shadow:0 2px 8px rgba(29,66,138,.35)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.07)}
.card h3{margin:0 0 10px;font-size:.95rem;color:var(--blue);display:flex;align-items:center;justify-content:space-between;gap:8px}
h2{font-size:1.05rem;margin:18px 4px 8px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.sec,button.sec{background:#e8edf7;color:var(--blue)}
.btn.danger,button.danger{background:#fbe9e9;color:var(--loss)}
button.add{background:none;color:var(--blue);padding:8px 0;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);border-color:var(--blue)}
textarea{min-height:120px;resize:vertical}
label.f{display:block;font-size:.78rem;color:var(--muted);margin-bottom:10px}
label.f > input,label.f > select,label.f > textarea{margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.full{grid-column:1/-1}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;margin:4px 0 10px}
.toggle input{width:20px;height:20px}
.score-in{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.score-in .dash{padding-bottom:20px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.row .w-num{width:58px;flex:none}
.row .w-team{width:84px;flex:none}
.row .w-sel{width:108px;flex:none}
.row .w-txt{flex:1 1 120px}
.row .x{background:none;color:var(--muted);padding:6px 8px;flex:none}
.row label.chk{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);flex:none}
.row label.chk input{width:18px;height:18px}
.savebar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px 0}
.savebar button{flex:1;padding:13px;box-shadow:0 2px 10px rgba(20,30,60,.18)}
/* list */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters input{grid-column:1/-1}
.m{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(20,30,60,.07)}
.badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;background:#aab}
.badge.W{background:var(--win)}.badge.D{background:var(--draw)}.badge.L{background:var(--loss)}
.m .mid{flex:1;min-width:0}
.m .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .rt{font-size:.8rem;color:var(--blue);font-weight:700;flex:none}
.season{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;color:var(--blue);font-weight:700}
.season span{font-size:.78rem;color:var(--muted);font-weight:500}
.banner{background:#fff6cc;border:1px solid var(--yellow);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
.banner a{color:var(--blue);font-weight:700}
.empty{text-align:center;padding:40px 16px}
.empty .big{font-size:3rem}
/* detail */
.hero{background:linear-gradient(160deg,var(--blue),var(--blue-d));color:#fff;border-radius:var(--r);padding:18px 14px;margin-bottom:12px;text-align:center;border-bottom:4px solid var(--yellow)}
.hero .meta{font-size:.8rem;opacity:.85}
.hero .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 6px}
.hero .tm{font-weight:700;font-size:.98rem}
.hero .sc{font-size:2.3rem;font-weight:800;letter-spacing:.04em;background:rgba(255,255,255,.12);padding:2px 14px;border-radius:12px}
.hero .note{font-size:.82rem;color:var(--yellow);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.ev{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f2f7;font-size:.9rem}
.ev.r{flex-direction:row-reverse;text-align:right}
.ev .min{font-weight:700;color:var(--blue);min-width:42px}
.ev.r .min{text-align:right}
.ev .who{flex:1}
.ev .sub{font-size:.78rem;color:var(--muted)}
.xi{columns:2;column-gap:16px;font-size:.9rem;margin:0;padding:0;list-style:none}
.xi li{padding:3px 0;break-inside:avoid}
.xi .n{display:inline-block;min-width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.cap{background:var(--yellow);color:var(--blue);font-size:.65rem;font-weight:800;border-radius:4px;padding:0 4px;margin-left:4px}
.review{white-space:pre-wrap;font-size:.95rem}
.rating{display:inline-block;background:var(--yellow);color:var(--blue);font-weight:800;border-radius:8px;padding:2px 9px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(20,30,60,.07)}
.tile b{display:block;font-size:1.45rem;color:var(--blue);font-variant-numeric:tabular-nums}
.tile span{font-size:.72rem;color:var(--muted)}
.wdl{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0}
.wdl i{display:block}
table.rank{width:100%;border-collapse:collapse;font-size:.9rem}
table.rank td{padding:6px 4px;border-bottom:1px solid #f0f2f7}
table.rank td.n{text-align:right;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
table.rank td.p{color:var(--muted);width:24px}
.bar{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:5px 0}
.bar .lb{width:58px;color:var(--muted)}
.bar .tr{flex:1;background:#eef1f7;border-radius:5px;height:14px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--blue)}
.bar .v{width:28px;text-align:right;font-weight:700}
@media (min-width:640px){
  .grid3.wide{grid-template-columns:repeat(3,1fr)}
  .filters{grid-template-columns:2fr 1fr 1fr 1fr}
  .filters input{grid-column:auto}
  .tiles{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@media (max-width:480px){header small{display:none}}
</style>
</head>
<body>
<header><div class="in"><div class="ball">LUFC</div><div><h1>Matchday Log</h1><small>Every Leeds United game I've been to</small></div><a id="syncpill" class="pill" href="#/data" hidden></a></div></header>
<main id="app"></main>
<nav class="tabs"><div class="in">
  <a href="#/" data-t="list"><span class="i">📋</span>Matches</a>
  <a href="#/stats" data-t="stats"><span class="i">📊</span>Stats</a>
  <a href="#/new" data-t="new" class="add"><span class="i">+</span>Add</a>
  <a href="#/data" data-t="data"><span class="i">☁️</span>Sync</a>
</div></nav>
<datalist id="players"></datalist>
<datalist id="comps"></datalist>
<datalist id="opps"></datalist>
<datalist id="grounds"></datalist>

<script>
/* ---------- storage ---------- */
const KEY = 'lufc-matchday-log-v1';
/* Storage that falls back to memory if the browser blocks it (e.g. sandboxed previews) */
let EPHEMERAL = false;
const mem = {};
function mkStore(name){
  let s = null;
  try { s = window[name]; const t = '__t'; s.setItem(t, '1'); s.removeItem(t); } catch(e){ s = null; EPHEMERAL = true; }
  return {
    get: k => { try { return s ? s.getItem(k) : (mem[name+k] ?? null); } catch(e){ return mem[name+k] ?? null; } },
    put: (k, v) => { if(s){ s.setItem(k, v); } else { mem[name+k] = v; } },
    del: k => { try { s ? s.removeItem(k) : delete mem[name+k]; } catch(e){} }
  };
}
const LS = mkStore('localStorage'), SS = mkStore('sessionStorage');
let db = load();
function load(){
  try { const d = JSON.parse(LS.get(KEY)); if (d && Array.isArray(d.matches)){ d.meta = d.meta || {}; d.tomb = d.tomb || {}; return d; } } catch(e){}
  return { matches: [], meta: {}, tomb: {} };
}
/* ids present at the last save, so removed matches can be recorded as deletions (tombstones) and synced */
let knownIds = new Set(db.matches.map(m => m.id));
function trackDeletes(){
  const now = new Set(db.matches.map(m => m.id)), t = new Date().toISOString();
  knownIds.forEach(id => { if(!now.has(id)) db.tomb[id] = t; });
  now.forEach(id => delete db.tomb[id]);
  knownIds = now;
}
function saveLocal(){
  try { LS.put(KEY, JSON.stringify(db)); return true; }
  catch(e){ alert('Could not save on this device: ' + e.message + '\nPlease export a backup from the Sync tab.'); return false; }
}
function save(){
  trackDeletes();
  const ok = saveLocal();
  cloudReconcile();
  return ok;
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
function seasonOf(d){ if(!d) return 'Undated'; const [y,m] = d.split('-').map(Number); const s = m >= 7 ? y : y-1; return s + '/' + String(s+1).slice(-2); }
function minVal(t){ const m = String(t||'').match(/(\d+)(?:\s*\+\s*(\d+))?/); return m ? (+m[1]) + (m[2] ? +m[2]/100 : 0) : 999; }
function minTxt(t){ t = String(t||'').trim(); if(!t) return ''; return /'$/.test(t) ? t : t + "'"; }
function fmtDate(d, long){ if(!d) return 'No date'; const dt = new Date(d + 'T12:00:00'); return dt.toLocaleDateString('en-GB', long ? {weekday:'long',day:'numeric',month:'long',year:'numeric'} : {weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function res(m){ const l = num(m.ls), o = num(m.os); if(l == null || o == null) return null; return l > o ? 'W' : l < o ? 'L' : 'D'; }
function penNote(m){ if(!m.pens || num(m.pl) == null || num(m.po) == null) return ''; return (+m.pl > +m.po ? 'Leeds won ' : 'Leeds lost ') + m.pl + '–' + m.po + ' on penalties'; }
const venueTxt = v => ({H:'Home',A:'Away',N:'Neutral'})[v] || '';
function sides(m){
  const L = {name:'Leeds United', s:m.ls}, O = {name:m.opp || 'Opponent', s:m.os};
  return m.venue === 'A' ? [O, L] : [L, O];
}
function scoreTxt(m){ const [a,b] = sides(m); const has = a.s !== '' && a.s != null && b.s !== '' && b.s != null; return `${a.name} ${has ? a.s + '–' + b.s : 'v'} ${b.name}`; }
const sorted = () => [...db.matches].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.ko||'').localeCompare(a.ko||''));
function teamName(m, t){ return t === 'O' ? (m.opp || 'Opponent') : 'Leeds'; }

function refreshLists(){
  const players = new Set(), comps = new Set(['Premier League','Championship','League One','First Division','Second Division','FA Cup','League Cup','Play-off','UEFA Cup','Champions League','European Cup','Cup Winners\' Cup','Full Members\' Cup','Charity Shield','Community Shield','Europa League','Friendly','Pre-season friendly']), opps = new Set(), grounds = new Set(['Elland Road']);
  for(const m of db.matches){
    (m.lineup||[]).concat(m.bench||[]).forEach(p => p.name && players.add(p.name));
    (m.subs||[]).forEach(s => { if(s.t !== 'O'){ s.on && players.add(s.on); s.off && players.add(s.off); } });
    (m.goals||[]).forEach(g => g.t !== 'O' && g.type !== 'OG' && g.p && players.add(g.p));
    m.comp && comps.add(m.comp); m.opp && opps.add(m.opp); m.ground && grounds.add(m.ground);
  }
  const fill = (id, set) => $('#' + id).innerHTML = [...set].sort().map(v => `<option value="${esc(v)}">`).join('');
  fill('players', players); fill('comps', comps); fill('opps', opps); fill('grounds', grounds);
}

/* ---------- router ---------- */
let filt = { q:'', season:'', comp:'', venue:'' };
let curPath = (location.hash.slice(1) || '/');
function go(h){
  curPath = String(h).replace(/^#/, '') || '/';
  try { if(location.hash !== '#' + curPath) history.pushState(null, '', '#' + curPath); } catch(e){}
  route();
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if(!a) return;
  e.preventDefault(); go(a.getAttribute('href'));
});
function fromLocation(){ const h = location.hash.slice(1) || '/'; if(h !== curPath){ curPath = h; route(); } }
window.addEventListener('popstate', fromLocation);
function route(keepScroll){
  const parts = curPath.split('/').filter(Boolean);
  const [view, id] = parts;
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === (view || 'list') || (view === 'edit' && a.dataset.t === 'new')));
  refreshLists();
  if(!view) listView();
  else if(view === 'match') detailView(id);
  else if(view === 'new') formView(null);
  else if(view === 'edit') formView(db.matches.find(m => m.id === id));
  else if(view === 'stats') statsView();
  else if(view === 'data') dataView();
  else listView();
  if(EPHEMERAL) app.insertAdjacentHTML('afterbegin', `<div class="banner">⚠️ Preview mode: this browser window isn't letting the page save, so anything you enter will vanish when you close it. Once it's on its own website, saving works normally.</div>`);
  if(!keepScroll) try { window.scrollTo(0,0); } catch(e){}
}
/* re-draw after a change arrives from another device – but never while a match form is open */
function rerender(){ const v = curPath.split('/').filter(Boolean)[0]; if(v === 'new' || v === 'edit') return; route(true); }
window.addEventListener('hashchange', fromLocation);

/* ---------- list ---------- */
function listView(){
  const all = sorted();
  if(!all.length){
    app.innerHTML = `<div class="card empty"><div class="big">⚽</div><h2>No matches yet</h2><p class="muted">Add the first game you went to – from last weekend or from 1985, it all counts.</p><a class="btn" href="#/new">Add a match</a></div>`;
    return;
  }
  const seasons = [...new Set(all.map(m => seasonOf(m.date)))];
  const comps = [...new Set(all.map(m => m.comp).filter(Boolean))].sort();
  const last = db.meta.lastBackup ? new Date(db.meta.lastBackup) : null;
  const nudge = !cloud.user && (!last || (Date.now() - last) > 30*864e5);
  app.innerHTML = `
    ${nudge ? `<div class="banner">☁️ Matches are only saved on this device. <a href="#/data">Sign in to back up &amp; sync automatically</a></div>` : ''}
    <div class="filters">
      <input id="fq" type="search" placeholder="Search opponent, player, ground…" value="${esc(filt.q)}">
      <select id="fs"><option value="">All seasons</option>${seasons.map(s => `<option ${s===filt.season?'selected':''}>${s}</option>`).join('')}</select>
      <select id="fc"><option value="">All competitions</option>${comps.map(s => `<option ${s===filt.comp?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <select id="fv"><option value="">Home &amp; away</option><option value="H" ${filt.venue==='H'?'selected':''}>Home</option><option value="A" ${filt.venue==='A'?'selected':''}>Away</option><option value="N" ${filt.venue==='N'?'selected':''}>Neutral</option></select>
    </div>
    <div id="mlist"></div>`;
  const draw = () => {
    const q = filt.q.toLowerCase();
    const ms = all.filter(m =>
      (!filt.season || seasonOf(m.date) === filt.season) && (!filt.comp || m.comp === filt.comp) && (!filt.venue || m.venue === filt.venue) &&
      (!q || JSON.stringify([m.opp,m.ground,m.comp,m.round,m.review,m.motm,m.with,m.lineup,m.bench,m.goals,m.subs]).toLowerCase().includes(q)));
    let html = '', cur = null;
    const bySeason = {};
    ms.forEach(m => { const s = seasonOf(m.date); (bySeason[s] = bySeason[s] || []).push(m); });
    for(const m of ms){
      const s = seasonOf(m.date);
      if(s !== cur){ cur = s; const g = bySeason[s]; const w = g.filter(x => res(x)==='W').length, d = g.filter(x => res(x)==='D').length, l = g.filter(x => res(x)==='L').length;
        html += `<div class="season">${s}<span>${g.length} game${g.length>1?'s':''} · W${w} D${d} L${l}</span></div>`; }
      const r = res(m);
      html += `<a class="m" href="#/match/${m.id}"><div class="badge ${r||''}">${r||'–'}</div><div class="mid"><div class="t">${esc(scoreTxt(m))}</div><div class="s">${fmtDate(m.date)} · ${esc([m.comp, m.ground || venueTxt(m.venue)].filter(Boolean).join(' · '))}${m.pens ? ' · pens' : m.et ? ' · aet' : ''}</div></div>${m.rating ? `<div class="rt">${esc(m.rating)}/10</div>` : ''}</a>`;
    }

/* ---------- match finder (ESPN public data, 2001/02 onwards) ---------- */
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/soccer/', LEEDS_ID = '357', ESPN_FIRST = 2001;
const espnCache = {};
async function espnJSON(path){
  if(espnCache[path]) return espnCache[path];
  const r = await fetch(ESPN + path);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return espnCache[path] = await r.json();
}
const seasonStart = d => { const [y, mo] = d.split('-').map(Number); return mo >= 7 ? y : y - 1; };
const curSeason = () => seasonStart(new Date().toISOString().slice(0, 10));
const seasonLbl = y => y + '/' + String(y + 1).slice(-2);
async function espnSeason(y){
  const d = await espnJSON(`all/teams/${LEEDS_ID}/schedule?season=${y}`);
  return (d.events || []).filter(e => e.competitions?.[0]?.status?.type?.completed);
}
function londonParts(iso){
  const p = {}; new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/London', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false})
    .formatToParts(new Date(iso)).forEach(x => p[x.type] = x.value);
  return { date: `${p.year}-${p.month}-${p.day}`, ko: `${p.hour === '24' ? '00' : p.hour}:${p.minute}` };
}
function tidyRound(r){
  r = String(r || '').trim(); if(!r) return '';
  const ord = n => n + (['th','st','nd','rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : Math.min(n % 10, 4) % 4] || 'th');
  const words = {first:1, second:2, third:3, fourth:4, fifth:5, sixth:6, seventh:7};
  let x;
  if((x = r.match(/^round\s*(\d+)$/i))) return ord(+x[1]) + ' round';
  if((x = r.match(/^(\d+)(?:st|nd|rd|th)\s+round$/i))) return ord(+x[1]) + ' round';
  if((x = r.match(/^(\w+)\s+round$/i)) && words[x[1].toLowerCase()]) return ord(words[x[1].toLowerCase()]) + ' round';
  if(/^semi-?finals?$/i.test(r)) return 'Semi-final';
  if(/^quarter-?finals?$/i.test(r)) return 'Quarter-final';
  if(/^finals?$/i.test(r)) return 'Final';
  return r;
}
function espnComp(ev){
  const slug = ev.league?.slug || '', st = ev.seasonType?.name || '';
  const names = {'eng.1':'Premier League','eng.2':'Championship','eng.3':'League One','eng.fa':'FA Cup','eng.league_cup':'League Cup','eng.charity':'Community Shield','club.friendly':'Friendly','uefa.uefa':'UEFA Cup','uefa.europa':'Europa League','uefa.champions':'Champions League','uefa.europa.conf':'Conference League','eng.trophy':'EFL Trophy'};
  let comp = names[slug] || String(ev.league?.name || '').replace(/^English\s+/, ''), round = '';
  if(/^eng\.[1-4]$/.test(slug)){ if(st && !/regular season|league/i.test(st)){ comp = 'Play-off'; round = st.replace(/^promotion\s*/i, ''); } }
  else if(slug !== 'club.friendly') round = st;
  return { comp, round: tidyRound(round) };
}
function espnSides(ev){
  const cs = ev.competitions[0].competitors;
  const L = cs.find(c => c.team?.id === LEEDS_ID) || cs[0], O = cs.find(c => c !== L);
  const sc = c => { const v = c?.score; return v == null ? '' : String(typeof v === 'object' ? (v.displayValue ?? v.value) : v); };

  const neutral = ev.competitions[0].neutralSite || /wembley|millennium stadium|principality stadium/i.test(ground) || (L.homeAway === 'home' && ground && !/elland road/i.test(ground));

function espnToMatch(ev, sum, prev){

    opp: O?.team?.displayName || '', venue, ground: gi.venue?.fullName || c.venue?.fullName || '', att: String(gi.attendance || c.attendance || '') .replace(/^0$/, ''),
    ref: gi.officials?.[0]?.fullName || '', ls, os, htl:'', hto:'', ftl:'', fto:'', pl:'', po:'', et:false, pens:false,
    goals:[], subs:[], cards:[], lineup:[], bench:[], oppXI:'', formation:'' };
  const side = id => id === LEEDS_ID ? 'L' : 'O', min = cl => String(cl?.displayValue || '').replace(/'/g, '').trim();
  const booked = new Set();
  for(const k of (sum?.keyEvents || [])){
    const t = k.type?.text || '', ps = (k.participants || []).map(p => p.athlete?.displayName || '');
    if(/shootout/i.test(t)) break;
    if(/extra time/i.test(t)) out.et = true;
    if(!k.team?.id) continue;
    if((k.scoringPlay || /^(goal|own goal|penalty - scored)/i.test(t)) && !/miss|saved/i.test(t)){
      const type = /own/i.test(t) ? 'OG' : /penalty/i.test(t) ? 'Pen' : /header/i.test(t) ? 'Header' : /free.?kick/i.test(t) ? 'Free kick' : /volley/i.test(t) ? 'Volley' : '';
      out.goals.push({ min: min(k.clock), t: side(k.team.id), p: ps[0] || '', type, a: type === 'OG' || type === 'Pen' ? '' : (ps[1] || '') });
    } else if(/substitution/i.test(t)){
      out.subs.push({ min: min(k.clock), t: side(k.team.id), off: ps[1] || '', on: ps[0] || '' });
    } else if(/card/i.test(t)){
      const who = ps[0] || '', red = /red/i.test(t);
      const kind = red ? ((/yellow|second/i.test(t) || booked.has(who)) ? '2nd yellow' : 'Red') : 'Yellow';
      if(!red) booked.add(who);
      out.cards.push({ min: min(k.clock), t: side(k.team.id), p: who, c: kind });
    }
  }
  if(/AET/.test(st)) out.et = true;
  if(/PEN/.test(st) || sum?.shootout?.length){
    out.pens = true;
    const so = sum?.shootout || [], n = id => { const s = so.find(x => String(x.id) === id); return s ? String(s.shots.filter(x => x.didScore).length) : ''; };
    out.pl = n(LEEDS_ID); out.po = n(O?.team?.id);
  }
  // half-time (and 90-minute) scores: from ESPN's period scores, else from the goals if the goal list is complete
  const hc = sum?.header?.competitions?.[0]?.competitors || [], ln = id => hc.find(x => x.team?.id === id)?.linescores?.[0]?.displayValue;
  const complete = out.goals.filter(g => g.t === 'L').length === +ls && out.goals.filter(g => g.t === 'O').length === +os;
  if(ln(LEEDS_ID) != null && ln(O?.team?.id) != null){ out.htl = String(ln(LEEDS_ID)); out.hto = String(ln(O.team.id)); }
  else if(complete){ const h = out.goals.filter(g => minVal(g.min) < 46); out.htl = String(h.filter(g => g.t === 'L').length); out.hto = String(h.filter(g => g.t === 'O').length); }
  if(out.et && complete){ const n = out.goals.filter(g => minVal(g.min) < 91); out.ftl = String(n.filter(g => g.t === 'L').length); out.fto = String(n.filter(g => g.t === 'O').length); }
  // line-ups
  const ros = sum?.rosters || [], RL = ros.find(r => r.team?.id === LEEDS_ID), RO = ros.find(r => r !== RL);
  const caps = new Set((prev?.lineup || []).filter(p => p.cap).map(p => p.name));
  const starters = r => { const s = (r?.roster || []).filter(p => p.starter); return s.every(p => +p.formationPlace > 0) ? s.sort((a, b) => a.formationPlace - b.formationPlace) : s; };
  if(RL){
    out.formation = RL.formation || '';
    out.lineup = starters(RL).map(p => ({ n: p.jersey || '', name: p.athlete?.displayName || '', cap: caps.has(p.athlete?.displayName) }));
    out.bench = RL.roster.filter(p => !p.starter).map(p => ({ n: p.jersey || '', name: p.athlete?.displayName || '' }));
  }
  if(RO){
    const xi = starters(RO).map(p => `${p.jersey ? p.jersey + ' ' : ''}${p.athlete?.displayName || ''}`), sb = RO.roster.filter(p => !p.starter).map(p => p.athlete?.displayName).filter(Boolean);
    out.oppXI = xi.join('\n') + (RO.formation ? `\n(${RO.formation})` : '') + (sb.length ? `\nSubs: ${sb.join(', ')}` : '');
  }
  return out;
}

/* Older seasons (1979/80–2000/01) come from data files in this repo, built from the
   Leeds United Historical Archive (lufchistory.com). From 2001/02 the data comes from ESPN. */
const HIST_FIRST = 1979;
async function histSeason(y){
  const k = 'hist:' + y;
  if(espnCache[k]) return espnCache[k];
  const r = await fetch(`data/history/${y}.json`);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return espnCache[k] = await r.json();
}
/* one shape for the finder list, whichever source the match came from */
function fxFromEspn(ev){
  const { O, ls, os, venue } = espnSides(ev), { comp, round } = espnComp(ev);
  return { key: 'e' + ev.id, src: 'espn', ev, date: londonParts(ev.date).date, opp: O?.team?.displayName || '', venue, ls, os, comp, round };
}
const fxFromHist = h => ({ key: 'h' + h.srcPath, src: 'hist', h, date: h.date, opp: h.opp, venue: h.venue, ls: h.ls, os: h.os, comp: h.comp, round: h.round });
async function seasonFixtures(y){
  return y >= ESPN_FIRST ? (await espnSeason(y)).map(fxFromEspn) : (await histSeason(y)).map(fxFromHist);
}
function histToMatch(h, prev){
  const caps = new Set((prev?.lineup || []).filter(p => p.cap).map(p => p.name));
  const keep = x => ({ ...x, cap: x.cap || caps.has(x.name) });
  return { espnId:'', espnLg:'', histId: h.srcPath, date: h.date, ko: '', comp: h.comp, round: h.round || '', opp: h.opp, venue: h.venue, ground: h.ground || '',
    att: h.att || '', ref: h.ref || '', manager: h.manager || '', ls: h.ls, os: h.os, htl: h.htl || '', hto: h.hto || '', ftl: '', fto: '',
    et: !!h.et, pens: !!h.pens, pl: h.pl || '', po: h.po || '', formation: '', oppXI: '',
    goals: (h.goals || []).map(g => ({...g})), subs: (h.subs || []).map(x => ({...x})), cards: (h.cards || []).map(x => ({...x})),
    lineup: (h.lineup || []).map(keep), bench: (h.bench || []).map(keep) };
}

function finderHTML(m, isNew, filled){
  const cs = curSeason(), start = m.date && m.date >= '1979-07-01' ? seasonStart(m.date) : cs;
  const opts = `<option value="all">All seasons</option>` + Array.from({length: cs - HIST_FIRST + 1}, (_, i) => cs - i).map(y => `<option value="${y}" ${y === start ? 'selected' : ''}>${seasonLbl(y)}</option>`).join('');
  const body = `<p class="small muted" style="margin:0 0 8px">Pick the season and tap the game – everything known about it fills in for you, then add your own review. From 2001/02 that includes both line-ups, subs and cards; for older games it's usually the score, Leeds scorers, attendance and the Leeds starting XI.</p>
      <div class="grid"><select id="fseason" aria-label="Season">${opts}</select><input id="fsearch" type="search" placeholder="Opponent or date" autocomplete="off"></div>
      <div id="fres" class="fres"></div>`;
  if(isNew && !filled) return `<div class="card finder"><h3>🔎 Find the match</h3>${body}</div>`;
  return `<div class="card finder"><details class="fd"><summary>${isNew ? 'Pick a different match' : '🔎 Fill in from online match data'}</summary><div style="margin-top:10px">${!isNew ? '<p class="small" style="margin:0 0 6px"><b>Replaces</b> the fixture, score, goals, line-ups, subs and cards. Your review and notes are kept.</p>' : ''}${body}</div></details></div>`;
}

function finderInit(f, m, isNew){
  const sel = $('#fseason'), q = $('#fsearch'), box = $('#fres');
  if(!sel) return;
  let fxs = [], token = 0;
  const lc = s => String(s || '').toLowerCase();
  const loggedIds = new Set(db.matches.flatMap(x => [x.espnId && 'e' + x.espnId, x.histId && 'h' + x.histId]).filter(Boolean));
  const loggedKey = new Set(db.matches.map(x => x.date + '|' + lc(x.opp)));
  const isLogged = fx => loggedIds.has(fx.key) || loggedKey.has(fx.date + '|' + lc(fx.opp));
  const draw = () => {
    const t = lc(q.value.trim());
    const list = fxs.filter(fx => !t || fx._s.includes(t));
    box.innerHTML = list.length ? list.slice(0, 150).map(fx => {
      const r = fx.ls === '' || fx.os === '' ? '' : +fx.ls > +fx.os ? 'W' : +fx.ls < +fx.os ? 'L' : 'D';
      return `<button type="button" class="fx" data-k="${esc(fx.key)}"><span class="badge ${r}">${r || '–'}</span><span class="mid"><b>${esc(fx.opp || '?')} <span class="muted" style="font-weight:400">(${fx.venue || '?'})</span></b><small>${fmtDate(fx.date)} · ${esc([fx.comp, fx.round].filter(Boolean).join(' – '))}</small></span>${isLogged(fx) ? '<span class="done">✓ logged</span>' : ''}<span class="sc">${esc(fx.ls)}–${esc(fx.os)}</span></button>`;
    }).join('') : `<p class="small muted" style="padding:8px 2px">${fxs.length ? 'No games match that search.' : 'No games found for that season.'}</p>`;
  };
  const load = async () => {
    const my = ++token, v = sel.value;
    box.innerHTML = `<p class="small muted" style="padding:8px 2px">Loading ${v === 'all' ? 'every season – this takes a few seconds' : seasonLbl(+v)}…</p>`;
    try {
      const ys = v === 'all' ? Array.from({length: curSeason() - HIST_FIRST + 1}, (_, i) => HIST_FIRST + i) : [+v];
      const lists = []; let fails = 0;
      for(let i = 0; i < ys.length; i += 6) lists.push(...await Promise.all(ys.slice(i, i + 6).map(y => seasonFixtures(y).catch(() => { fails++; return []; }))));
      if(fails === ys.length) throw new Error('unreachable');
      if(my !== token) return;
      const seen = new Set();
      fxs = lists.flat().filter(fx => !seen.has(fx.key) && seen.add(fx.key)).sort((a, b) => b.date.localeCompare(a.date));
      fxs.forEach(fx => { const [y, mo, dd] = fx.date.split('-');
        fx._s = lc([fx.opp, fx.comp, fx.round, fmtDate(fx.date), `${dd}/${mo}/${y}`, `${+dd}/${+mo}/${y.slice(2)}`, `${dd}/${mo}/${y.slice(2)}`].join(' ')); });
      draw();
    } catch(e){
      if(my === token) box.innerHTML = `<p class="small muted" style="padding:8px 2px">Couldn't reach the match data (no signal?). You can still fill the match in by hand below.</p>`;
    }
  };
  sel.onchange = load; q.oninput = draw;
  const det = sel.closest('details');
  if(det) det.addEventListener('toggle', () => { if(det.open && !fxs.length) load(); }, { once: true }); else load();
  box.onclick = async e => {
    const b = e.target.closest('.fx'); if(!b) return;
    const fx = fxs.find(x => x.key === b.dataset.k); if(!fx) return;
    const dup = db.matches.find(x => x.id !== m.id && (('e' + x.espnId) === fx.key || ('h' + x.histId) === fx.key || (x.date === fx.date && lc(x.opp) === lc(fx.opp))));
    if(dup && confirm(`You've already logged this match (${fmtDate(fx.date)} v ${dup.opp}).\n\nOK = open it\nCancel = carry on adding it again`)){ go('#/match/' + dup.id); return; }
    const cur = readForm(f, m);
    const hasData = (cur.goals || []).length || (cur.lineup || []).some(p => p.name) || cur.ls !== '';
    if(!isNew && hasData && !confirm('Replace the fixture, score, goals, line-ups, subs and cards with the online data?\n\nYour review, rating and notes are kept.')) return;
    let filled, msg;
    if(fx.src === 'hist'){
      filled = histToMatch(fx.h, cur);
      msg = `✓ Filled in <b>${esc(scoreTxt({...cur, ...filled}))}</b> from the Leeds United Historical Archive. For games this old the opposition scorers, subs and some details aren't recorded – add anything you remember, then your review at the bottom.`;
    } else {
      b.disabled = true; b.querySelector('.sc').textContent = '…';
      let sum = null;
      try { sum = await espnJSON(`${fx.ev.league?.slug || 'all'}/summary?event=${fx.ev.id}`); } catch(err){}
      filled = { ...espnToMatch(fx.ev, sum, cur), histId: '' };
      msg = sum ? `✓ Filled in <b>${esc(scoreTxt({...cur, ...filled}))}</b>. Have a quick check, then add your review at the bottom.`
                : `✓ Filled in the fixture and score for <b>${esc(scoreTxt({...cur, ...filled}))}</b>. Couldn't load the goals and line-ups just now – try again later, or add them by hand.`;
    }
    formView({ ...cur, ...filled, id: m.id, created: m.created }, isNew, msg);
    try { window.scrollTo(0, 0); } catch(err){}
  };
}

/* ---------- stats ---------- */
function statsView(){
  const ms = db.matches;
  if(!ms.length){ app.innerHTML = `<div class="card empty"><div class="big">📊</div><p class="muted">Stats appear once you've added some matches.</p></div>`; return; }
  const r = {W:0,D:0,L:0}; let gf = 0, ga = 0, rated = 0, rsum = 0;
  const scorers = {}, apps = {}, opps = {}, grounds = {}, decades = {}, comps = {}, seasons = new Set(), ven = {H:0,A:0,N:0};
  let best = null, worst = null, topRated = null;
  for(const m of ms){
    const x = res(m); if(x) r[x]++;
    gf += num(m.ls) || 0; ga += num(m.os) || 0;
    seasons.add(seasonOf(m.date)); ven[m.venue] = (ven[m.venue] || 0) + 1;
    if(m.rating){ rated++; rsum += +m.rating; if(!topRated || +m.rating > +topRated.rating) topRated = m; }
    (m.goals||[]).forEach(g => { if(g.t !== 'O' && g.type !== 'OG' && g.p) scorers[g.p] = (scorers[g.p] || 0) + 1; });
    const seen = new Set(); (m.lineup||[]).forEach(p => p.name && seen.add(p.name)); (m.subs||[]).forEach(s => s.t !== 'O' && s.on && seen.add(s.on));
    seen.forEach(n => apps[n] = (apps[n] || 0) + 1);
    if(m.opp){ const o = opps[m.opp] = opps[m.opp] || {P:0,W:0,D:0,L:0}; o.P++; if(x) o[x]++; }
    if(m.ground) grounds[m.ground] = (grounds[m.ground] || 0) + 1;
    if(m.comp) comps[m.comp] = (comps[m.comp] || 0) + 1;
    if(m.date){ const d = Math.floor(+m.date.slice(0,4) / 10) * 10 + 's'; decades[d] = (decades[d] || 0) + 1; }
    if(x){ const diff = num(m.ls) - num(m.os);
      if(diff > 0 && (!best || diff > best.d || (diff === best.d && +m.ls > +best.m.ls))) best = {m, d:diff};
      if(diff < 0 && (!worst || diff < worst.d)) worst = {m, d:diff}; }
  }
  const P = r.W + r.D + r.L;
  const top = (o, n = 10) => Object.entries(o).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, n);
  const rank = (rows, unit) => rows.length ? `<table class="rank">${rows.map(([k,v],i) => `<tr><td class="p">${i+1}</td><td>${esc(k)}</td><td class="n">${v}${unit ? ' ' + (v === 1 ? unit.replace(/s$/, '') : unit) : ''}</td></tr>`).join('')}</table>` : '<p class="muted small">Nothing recorded yet.</p>';
  const dmax = Math.max(...Object.values(decades), 1);
  const link = (m, lbl) => m ? `<a href="#/match/${m.id}" style="color:var(--blue)">${lbl}</a> <span class="muted small">${fmtDate(m.date)}</span>` : '–';
  app.innerHTML = `
    <h2>My Leeds record</h2>
    <div class="tiles">
      <div class="tile"><b>${ms.length}</b><span>Games</span></div>
      <div class="tile"><b>${seasons.size}</b><span>Seasons</span></div>
      <div class="tile"><b>${Object.keys(grounds).length}</b><span>Grounds</span></div>
      <div class="tile"><b>${gf}</b><span>Leeds goals</span></div>
      <div class="tile"><b>${ga}</b><span>Conceded</span></div>
      <div class="tile"><b>${P ? Math.round(r.W / P * 100) : 0}%</b><span>Win rate</span></div>
    </div>
    <div class="card"><h3>Won ${r.W} · Drawn ${r.D} · Lost ${r.L}</h3>
      <div class="wdl">${P ? `<i style="width:${r.W/P*100}%;background:var(--win)"></i><i style="width:${r.D/P*100}%;background:var(--draw)"></i><i style="width:${r.L/P*100}%;background:var(--loss)"></i>` : ''}</div>
      <p class="small muted" style="margin:6px 0 0">Home ${ven.H||0} · Away ${ven.A||0} · Neutral ${ven.N||0}${rated ? ` · Average rating ${(rsum/rated).toFixed(1)}/10` : ''}</p>
    </div>
    <div class="card"><h3>Highlights</h3><dl class="kv">
      <dt>Biggest win</dt><dd>${best ? link(best.m, esc(scoreTxt(best.m))) : '–'}</dd>
      <dt>Heaviest defeat</dt><dd>${worst ? link(worst.m, esc(scoreTxt(worst.m))) : '–'}</dd>
      <dt>Top-rated game</dt><dd>${topRated ? link(topRated, esc(scoreTxt(topRated)) + ' (' + esc(topRated.rating) + '/10)') : '–'}</dd>
      <dt>First game logged</dt><dd>${(() => { const f = [...ms].filter(m => m.date).sort((a,b) => a.date.localeCompare(b.date))[0]; return f ? link(f, esc(scoreTxt(f))) : '–'; })()}</dd>
    </dl></div>
    <div class="card"><h3>Goals I've seen – top scorers</h3>${rank(top(scorers), '')}</div>
    <div class="card"><h3>Players I've seen play most</h3>${rank(top(apps), 'games')}</div>
    <div class="card"><h3>Games by decade</h3>${Object.keys(decades).sort().map(d => `<div class="bar"><span class="lb">${d}</span><span class="tr"><i style="width:${decades[d]/dmax*100}%"></i></span><span class="v">${decades[d]}</span></div>`).join('')}</div>
    <div class="card"><h3>Opponents</h3>${Object.keys(opps).length ? `<table class="rank">${Object.entries(opps).sort((a,b) => b[1].P - a[1].P || a[0].localeCompare(b[0])).map(([k,o]) => `<tr><td>${esc(k)}</td><td class="n">${o.P} <span class="muted small" style="font-weight:400">W${o.W} D${o.D} L${o.L}</span></td></tr>`).join('')}</table>` : '<p class="muted small">–</p>'}</div>
    <div class="card"><h3>Grounds visited</h3>${rank(top(grounds, 999), '')}</div>
    <div class="card"><h3>Competitions</h3>${rank(top(comps, 999), '')}</div>`;
}

/* ---------- backup ---------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportJSON(){
  db.meta.lastBackup = new Date().toISOString(); save();
  download('leeds-matchday-log-' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(db, null, 2), 'application/json');
  dataView();
}
function exportCSV(){
  const cols = ['Date','Season','Competition','Round','Opponent','Venue','Ground','Leeds','Opp','HT','AET','Pens','Result','Leeds scorers','Attendance','Referee','Rating','MOTM','Review'];
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = sorted().reverse().map(m => [m.date, seasonOf(m.date), m.comp, m.round, m.opp, venueTxt(m.venue), m.ground, m.ls, m.os, (m.htl || m.hto) ? `${m.htl}-${m.hto}` : '', m.et ? 'Yes' : '', m.pens ? `${m.pl}-${m.po}` : '', res(m) || '',
    (m.goals||[]).filter(g => g.t !== 'O').map(g => `${g.p}${g.type === 'OG' ? ' (og)' : g.type === 'Pen' ? ' (pen)' : ''} ${minTxt(g.min)}`).join('; '), m.att, m.ref, m.rating, m.motm, m.review].map(q).join(','));
  download('leeds-matchday-log.csv', '﻿' + [cols.map(q).join(','), ...rows].join('\n'), 'text/csv');
}
function importJSON(input){
  const file = input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result); if(!d || !Array.isArray(d.matches)) throw new Error('Not a Matchday Log backup file');
      const replace = db.matches.length && confirm(`Backup has ${d.matches.length} matches.\n\nOK = REPLACE everything on this device with the backup\nCancel = MERGE (add any matches not already here)`);
      if(replace || !db.matches.length){ const t = new Date().toISOString(); db.matches = d.matches.map(m => ({...m, id: m.id || uid(), updated: t})); }
      else { const ids = new Set(db.matches.map(m => m.id)); d.matches.forEach(m => { if(!ids.has(m.id)) db.matches.push(m); else { const i = db.matches.findIndex(x => x.id === m.id); if((m.updated||'') > (db.matches[i].updated||'')) db.matches[i] = m; } }); }
      save(); alert('Done – ' + db.matches.length + ' matches on this device.'); go('#/');
    } catch(e){ alert('Could not read that file: ' + e.message); }
  };
  rd.readAsText(file);
}
function wipe(){
  if(prompt(cloud.user ? 'This deletes ALL matches – on this device, in the cloud and on every device you\'re signed in on. Type DELETE to confirm.' : 'This deletes ALL matches on this device. Type DELETE to confirm.') === 'DELETE'){ db.matches = []; save(); go('#/'); }
}
function dataView(){
  const last = db.meta.lastBackup;
  app.innerHTML = `
    <h2>Sync &amp; backup</h2>
    ${syncCardHTML()}
    <div class="card"><h3>Backup file</h3>
      <p class="small muted" style="margin-top:0">${cloud.user ? 'Your matches are already backed up in the cloud. A file is an extra copy you control – handy once a season.' : 'Saves a file with every match. Keep a copy somewhere safe – email it to yourself, or put it in Google Drive / iCloud.'}<br>${db.matches.length} matches on this device · Last backup file: ${last ? new Date(last).toLocaleString('en-GB') : 'never'}</p>
      <button onclick="exportJSON()">⬇️ Download backup file</button>
    </div>
    <div class="card"><h3>Restore / move to another device</h3>
      <p class="small muted" style="margin-top:0">Choose a backup file made by this site.${cloud.user ? ' Restored matches are synced to your other devices too.' : ''}</p>
      <input type="file" accept=".json,application/json" onchange="importJSON(this)">
    </div>
    <div class="card"><h3>Spreadsheet</h3>
      <p class="small muted" style="margin-top:0">A summary of every match to open in Excel or Google Sheets (for viewing – to restore, use the backup file above).</p>
      <button class="sec" onclick="exportCSV()">⬇️ Download spreadsheet (CSV)</button>
    </div>
    <div class="card"><h3>Danger zone</h3><button class="danger" onclick="wipe()">Delete all matches${cloud.user ? ' everywhere' : ' on this device'}</button></div>`;
}

/* ---------- cloud sync (Firebase) ----------
   This device's copy in localStorage is what the app reads and writes, so it works with no signal.
   When signed in, each match is also a document at users/{uid}/matches/{id}. Deleted matches become
   small "tombstone" documents so a deletion on one device isn't undone by another. When the same
   match differs, the copy with the later `updated` time wins. */
const FB_VER = '12.19.0';
const FB_CFG = {
  apiKey: "AIzaSyCFd1KRDQOHk5KYfQ9WKlSAohPUZkVa0T8",
  authDomain: "matchday-log.firebaseapp.com",
  projectId: "matchday-log",
  storageBucket: "matchday-log.firebasestorage.app",
  messagingSenderId: "339121033614",
  appId: "1:339121033614:web:0b87a1a885460145f794df"
};
const cloud = { fb:null, failed:false, user:undefined, col:null, unsub:null, remote:new Map(), live:false, pending:false, fromCache:false, error:'' };

async function cloudInit(){
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/firebase-`;
    const [A, U, F] = await Promise.all([import(base + 'app.js'), import(base + 'auth.js'), import(base + 'firestore.js')]);
    const app = A.initializeApp(FB_CFG);
    cloud.fb = { U, F, auth: U.getAuth(app), fs: F.getFirestore(app) };
    U.onAuthStateChanged(cloud.fb.auth, user => user ? cloudStart(user) : cloudStop());
  } catch(e){
    cloud.failed = true; cloud.user = null; cloudStatus();
    if(curPath === '/data') rerender();
  }
}

function cloudStart(user){
  if(cloud.user && cloud.user.uid === user.uid) return;
  const { F, fs } = cloud.fb;
  if(db.meta.uid && db.meta.uid !== user.uid && db.matches.length &&
     !confirm(`This device has ${db.matches.length} matches from a different account.\n\nOK = add them to ${user.email || 'this account'} as well\nCancel = remove them from this device`)){
    db.matches = []; db.tomb = {}; knownIds = new Set();
  }
  cloud.user = user; cloud.live = false; cloud.error = '';
  db.meta.uid = user.uid; db.meta.email = user.email || ''; saveLocal();
  cloud.col = F.collection(fs, 'users', user.uid, 'matches');
  cloud.unsub = F.onSnapshot(cloud.col, { includeMetadataChanges: true }, snap => {
    cloud.fromCache = snap.metadata.fromCache;
    cloud.pending = snap.metadata.hasPendingWrites;
    if(!cloud.live && snap.metadata.fromCache){ cloudStatus(); return; } // wait for the real server copy before comparing
    cloud.remote = new Map(snap.docs.map(d => [d.id, { ...d.data(), id: d.id }]));
    cloud.live = true; cloud.error = '';
    if(!snap.metadata.hasPendingWrites) db.meta.lastSync = new Date().toISOString();
    cloudReconcile();
    cloudStatus();
  }, err => { cloud.error = err.code || err.message; cloudStatus(); });
  cloudStatus(); rerender();
}

function cloudStop(){
  if(cloud.unsub) cloud.unsub();
  Object.assign(cloud, { user:null, col:null, unsub:null, remote:new Map(), live:false, pending:false });
  cloudStatus(); rerender();
}

function cloudReconcile(){
  if(!cloud.live || !cloud.user) return;
  const local = new Map(db.matches.map(m => [m.id, m]));
  const ids = new Set([...local.keys(), ...Object.keys(db.tomb), ...cloud.remote.keys()]);
  const push = []; let changed = false, tombs = false;
  for(const id of ids){
    const l = local.get(id), r = cloud.remote.get(id);
    const lt = l ? (l.updated || '') : (id in db.tomb ? db.tomb[id] : null);
    const rt = r ? (r.updated || '') : null;
    if(rt !== null && (lt === null || rt > lt)){            // the cloud copy is newer
      if(r.deleted){ if(l){ local.delete(id); changed = true; } db.tomb[id] = rt; tombs = true; }
      else { local.set(id, r); if(id in db.tomb){ delete db.tomb[id]; tombs = true; } changed = true; }
    } else if(lt !== null && (rt === null || lt > rt)){     // this device's copy is newer
      push.push(l || { id, deleted: true, updated: lt });
    }
  }
  if(changed){ db.matches = [...local.values()]; knownIds = new Set(local.keys()); }
  if(changed || tombs) saveLocal();
  if(changed) rerender();
  if(push.length){
    const { F, fs } = cloud.fb;
    for(let i = 0; i < push.length; i += 400){
      const b = F.writeBatch(fs);
      push.slice(i, i + 400).forEach(m => b.set(F.doc(cloud.col, m.id), JSON.parse(JSON.stringify(m))));
      b.commit().catch(e => { cloud.error = e.code || e.message; cloudStatus(); });
    }
  }
}

function cloudStatus(){
  const p = $('#syncpill'); if(!p) return;
  let txt = '', cls = '';
  if(cloud.user === undefined && !cloud.failed){ p.hidden = true; return; }
  if(!cloud.user){ txt = cloud.failed ? 'Offline' : 'Sign in to sync'; cls = ''; }
  else if(cloud.error){ txt = '⚠️ Sync problem'; cls = 'warn'; }
  else if(!navigator.onLine || cloud.fromCache){ txt = '📴 Offline – saved here'; cls = 'warn'; }
  else if(cloud.pending || !cloud.live){ txt = '⏳ Syncing…'; cls = 'ok'; }
  else { txt = '✓ Synced'; cls = 'ok'; }
  p.textContent = txt; p.className = 'pill ' + cls; p.hidden = false;
  const s = $('#syncstate'); if(s) s.textContent = syncStateText();
}
window.addEventListener('online', cloudStatus);
window.addEventListener('offline', cloudStatus);

function syncStateText(){
  if(cloud.error) return 'There was a problem syncing (' + cloud.error + '). Your matches are still saved on this device.';
  if(!navigator.onLine || cloud.fromCache) return 'No internet right now – changes are saved on this device and will sync when you\'re back online.';
  if(cloud.pending || !cloud.live) return 'Syncing…';
  return 'All matches synced' + (db.meta.lastSync ? ' · ' + new Date(db.meta.lastSync).toLocaleString('en-GB', {dateStyle:'medium', timeStyle:'short'}) : '') + '.';
}

function syncCardHTML(){
  if(cloud.user) return `<div class="card"><h3>☁️ Cloud sync is on</h3>
      <div class="who-box"><div class="small">Signed in as <b>${esc(cloud.user.email || 'you')}</b><div class="muted" id="syncstate">${esc(syncStateText())}</div></div>
      <button class="sec" onclick="cloudSignOut()">Sign out</button></div>
      <p class="small muted" style="margin:10px 0 0">Every match is backed up automatically. Sign in with the same account on your phone, tablet or computer and they'll all show the same matches.</p></div>`;
  if(cloud.failed) return `<div class="card"><h3>☁️ Cloud sync</h3><p class="small muted" style="margin:0">Can't reach the sync service right now (no internet?). Your matches are safe on this device. <a href="#/data" onclick="location.reload()">Try again</a></p></div>`;
  if(!cloud.fb) return `<div class="card"><h3>☁️ Cloud sync</h3><p class="small muted" style="margin:0">Loading…</p></div>`;
  return `<div class="card"><h3>☁️ Turn on cloud sync</h3>
      <p class="small" style="margin-top:0">Sign in once on each device. Your matches are then backed up automatically and stay the same on your phone and computer. Any matches already on this device are added to your account.</p>
      <button class="gbtn" onclick="cloudGoogle()"><b>G</b> Sign in with Google</button>
      <details class="alt"><summary>Use an email and password instead</summary>
        <div style="margin-top:10px">
          <label class="f">Email<input id="aem" type="email" autocomplete="username" autocapitalize="none"></label>
          <label class="f">Password<input id="apw" type="password" autocomplete="current-password" placeholder="at least 6 characters"></label>
          <div class="btns"><button onclick="cloudEmail(false)">Sign in</button><button class="sec" onclick="cloudEmail(true)">Create account</button><button class="add" onclick="cloudReset()">Forgot password?</button></div>
        </div>
      </details></div>`;
}

const authMsg = e => ({
  'auth/popup-blocked': 'The sign-in window was blocked. Please allow pop-ups for this site and try again.',
  'auth/unauthorized-domain': 'This website address isn\'t allowed to sign in yet (add it under Firebase → Authentication → Settings → Authorized domains).',
  'auth/operation-not-allowed': 'This sign-in method isn\'t switched on in Firebase yet.',
  'auth/invalid-credential': 'That email and password don\'t match.',
  'auth/wrong-password': 'That email and password don\'t match.',
  'auth/user-not-found': 'No account with that email – tap "Create account" first.',
  'auth/email-already-in-use': 'There\'s already an account with that email – tap "Sign in" instead (or sign in with Google if that\'s how it was made).',
  'auth/weak-password': 'Please use a password of at least 6 characters.',
  'auth/invalid-email': 'That doesn\'t look like an email address.',
  'auth/network-request-failed': 'No internet connection – try again when you\'re online.'
})[e.code] || ('Sign-in didn\'t work: ' + (e.code || e.message));
const quietAuth = e => ['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/user-cancelled'].includes(e.code);

function cloudGoogle(){
  if(!cloud.fb) return;
  const { U, auth } = cloud.fb;
  /* called straight from the tap (no await first) so browsers don't block the pop-up */
  U.signInWithPopup(auth, new U.GoogleAuthProvider()).catch(e => { if(!quietAuth(e)) alert(authMsg(e)); });
}
function cloudEmail(create){
  const { U, auth } = cloud.fb, em = $('#aem').value.trim(), pw = $('#apw').value;
  if(!em || !pw){ alert('Please enter an email and password.'); return; }
  (create ? U.createUserWithEmailAndPassword : U.signInWithEmailAndPassword)(auth, em, pw).catch(e => alert(authMsg(e)));
}
function cloudReset(){
  const { U, auth } = cloud.fb, em = $('#aem').value.trim();
  if(!em){ alert('Type your email in the box above first.'); return; }
  U.sendPasswordResetEmail(auth, em).then(() => alert('A password reset email is on its way to ' + em + '.'), e => alert(authMsg(e)));
}
function cloudSignOut(){
  if(!confirm('Sign out on this device? Your matches stay on this device and in the cloud, but changes here won\'t sync until you sign in again.')) return;
  cloud.fb.U.signOut(cloud.fb.auth);
}

route();
cloudInit();
</script>
</body>
</html>
