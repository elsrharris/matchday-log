<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D428A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matchday Log">
<title>Matchday Log – Leeds United</title>
<style>
:root{--blue:#1D428A;--blue-d:#14306a;--yellow:#FFCD00;--bg:#f3f5f9;--card:#fff;--ink:#16203a;--muted:#6b7590;--line:#e1e5ee;--win:#1f9d55;--draw:#b98d00;--loss:#d64545;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom));line-height:1.4}
header{background:var(--blue);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--yellow)}
header .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px}
header .ball{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
header h1{margin:0;font-size:1.1rem;line-height:1.1}
header small{opacity:.8;font-size:.78rem}
main{max-width:780px;margin:0 auto;padding:14px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:780px}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;padding:3px 0}
nav.tabs a .i{display:block;font-size:1.25rem;line-height:1.3}
nav.tabs a.on{color:var(--blue);font-weight:700}
nav.tabs a.add .i{background:var(--blue);color:var(--yellow);width:42px;height:42px;line-height:42px;border-radius:50%;margin:-14px auto 0;font-size:1.5rem;box-shadow:0 2px 8px rgba(29,66,138,.35)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.07)}
.card h3{margin:0 0 10px;font-size:.95rem;color:var(--blue);display:flex;align-items:center;justify-content:space-between;gap:8px}
h2{font-size:1.05rem;margin:18px 4px 8px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.sec,button.sec{background:#e8edf7;color:var(--blue)}
.btn.danger,button.danger{background:#fbe9e9;color:var(--loss)}
button.add{background:none;color:var(--blue);padding:8px 0;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);border-color:var(--blue)}
textarea{min-height:120px;resize:vertical}
label.f{display:block;font-size:.78rem;color:var(--muted);margin-bottom:10px}
label.f > input,label.f > select,label.f > textarea{margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.full{grid-column:1/-1}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;margin:4px 0 10px}
.toggle input{width:20px;height:20px}
.score-in{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.score-in .dash{padding-bottom:20px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.row .w-num{width:58px;flex:none}
.row .w-team{width:84px;flex:none}
.row .w-sel{width:108px;flex:none}
.row .w-txt{flex:1 1 120px}
.row .x{background:none;color:var(--muted);padding:6px 8px;flex:none}
.row label.chk{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);flex:none}
.row label.chk input{width:18px;height:18px}
.savebar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px 0}
.savebar button{flex:1;padding:13px;box-shadow:0 2px 10px rgba(20,30,60,.18)}
/* list */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters input{grid-column:1/-1}
.m{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(20,30,60,.07)}
.badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;background:#aab}
.badge.W{background:var(--win)}.badge.D{background:var(--draw)}.badge.L{background:var(--loss)}
.m .mid{flex:1;min-width:0}
.m .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .rt{font-size:.8rem;color:var(--blue);font-weight:700;flex:none}
.season{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;color:var(--blue);font-weight:700}
.season span{font-size:.78rem;color:var(--muted);font-weight:500}
.banner{background:#fff6cc;border:1px solid var(--yellow);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
.banner a{color:var(--blue);font-weight:700}
.empty{text-align:center;padding:40px 16px}
.empty .big{font-size:3rem}
/* detail */
.hero{background:linear-gradient(160deg,var(--blue),var(--blue-d));color:#fff;border-radius:var(--r);padding:18px 14px;margin-bottom:12px;text-align:center;border-bottom:4px solid var(--yellow)}
.hero .meta{font-size:.8rem;opacity:.85}
.hero .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0 6px}
.hero .tm{font-weight:700;font-size:.98rem}
.hero .sc{font-size:2.3rem;font-weight:800;letter-spacing:.04em;background:rgba(255,255,255,.12);padding:2px 14px;border-radius:12px}
.hero .note{font-size:.82rem;color:var(--yellow);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.ev{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f2f7;font-size:.9rem}
.ev.r{flex-direction:row-reverse;text-align:right}
.ev .min{font-weight:700;color:var(--blue);min-width:42px}
.ev.r .min{text-align:right}
.ev .who{flex:1}
.ev .sub{font-size:.78rem;color:var(--muted)}
.xi{columns:2;column-gap:16px;font-size:.9rem;margin:0;padding:0;list-style:none}
.xi li{padding:3px 0;break-inside:avoid}
.xi .n{display:inline-block;min-width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.cap{background:var(--yellow);color:var(--blue);font-size:.65rem;font-weight:800;border-radius:4px;padding:0 4px;margin-left:4px}
.review{white-space:pre-wrap;font-size:.95rem}
.rating{display:inline-block;background:var(--yellow);color:var(--blue);font-weight:800;border-radius:8px;padding:2px 9px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(20,30,60,.07)}
.tile b{display:block;font-size:1.45rem;color:var(--blue);font-variant-numeric:tabular-nums}
.tile span{font-size:.72rem;color:var(--muted)}
.wdl{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0}
.wdl i{display:block}
table.rank{width:100%;border-collapse:collapse;font-size:.9rem}
table.rank td{padding:6px 4px;border-bottom:1px solid #f0f2f7}
table.rank td.n{text-align:right;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
table.rank td.p{color:var(--muted);width:24px}
.bar{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:5px 0}
.bar .lb{width:58px;color:var(--muted)}
.bar .tr{flex:1;background:#eef1f7;border-radius:5px;height:14px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--blue)}
.bar .v{width:28px;text-align:right;font-weight:700}
@media (min-width:640px){
  .grid3.wide{grid-template-columns:repeat(3,1fr)}
  .filters{grid-template-columns:2fr 1fr 1fr 1fr}
  .filters input{grid-column:auto}
  .tiles{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="in"><div class="ball">LUFC</div><div><h1>Matchday Log</h1><small>Every Leeds United game I've been to</small></div></div></header>
<main id="app"></main>
<nav class="tabs"><div class="in">
  <a href="#/" data-t="list"><span class="i">📋</span>Matches</a>
  <a href="#/stats" data-t="stats"><span class="i">📊</span>Stats</a>
  <a href="#/new" data-t="new" class="add"><span class="i">+</span>Add</a>
  <a href="#/data" data-t="data"><span class="i">💾</span>Backup</a>
</div></nav>
<datalist id="players"></datalist>
<datalist id="comps"></datalist>
<datalist id="opps"></datalist>
<datalist id="grounds"></datalist>

<script>
/* ---------- storage ---------- */
const KEY = 'lufc-matchday-log-v1';
/* Storage that falls back to memory if the browser blocks it (e.g. sandboxed previews) */
let EPHEMERAL = false;
const mem = {};
function mkStore(name){
  let s = null;
  try { s = window[name]; const t = '__t'; s.setItem(t, '1'); s.removeItem(t); } catch(e){ s = null; EPHEMERAL = true; }
  return {
    get: k => { try { return s ? s.getItem(k) : (mem[name+k] ?? null); } catch(e){ return mem[name+k] ?? null; } },
    put: (k, v) => { if(s){ s.setItem(k, v); } else { mem[name+k] = v; } },
    del: k => { try { s ? s.removeItem(k) : delete mem[name+k]; } catch(e){} }
  };
}
const LS = mkStore('localStorage'), SS = mkStore('sessionStorage');
let db = load();
function load(){
  try { const d = JSON.parse(LS.get(KEY)); if (d && Array.isArray(d.matches)) return d; } catch(e){}
  return { matches: [], meta: {} };
}
function save(){
  try { LS.put(KEY, JSON.stringify(db)); return true; }
  catch(e){ alert('Could not save on this device: ' + e.message + '\nPlease export a backup from the Backup tab.'); return false; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
function seasonOf(d){ if(!d) return 'Undated'; const [y,m] = d.split('-').map(Number); const s = m >= 7 ? y : y-1; return s + '/' + String(s+1).slice(-2); }
function minVal(t){ const m = String(t||'').match(/(\d+)(?:\s*\+\s*(\d+))?/); return m ? (+m[1]) + (m[2] ? +m[2]/100 : 0) : 999; }
function minTxt(t){ t = String(t||'').trim(); if(!t) return ''; return /'$/.test(t) ? t : t + "'"; }
function fmtDate(d, long){ if(!d) return 'No date'; const dt = new Date(d + 'T12:00:00'); return dt.toLocaleDateString('en-GB', long ? {weekday:'long',day:'numeric',month:'long',year:'numeric'} : {weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function res(m){ const l = num(m.ls), o = num(m.os); if(l == null || o == null) return null; return l > o ? 'W' : l < o ? 'L' : 'D'; }
function penNote(m){ if(!m.pens || num(m.pl) == null || num(m.po) == null) return ''; return (+m.pl > +m.po ? 'Leeds won ' : 'Leeds lost ') + m.pl + '–' + m.po + ' on penalties'; }
const venueTxt = v => ({H:'Home',A:'Away',N:'Neutral'})[v] || '';
function sides(m){
  const L = {name:'Leeds United', s:m.ls}, O = {name:m.opp || 'Opponent', s:m.os};
  return m.venue === 'A' ? [O, L] : [L, O];
}
function scoreTxt(m){ const [a,b] = sides(m); const has = a.s !== '' && a.s != null && b.s !== '' && b.s != null; return `${a.name} ${has ? a.s + '–' + b.s : 'v'} ${b.name}`; }
const sorted = () => [...db.matches].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.ko||'').localeCompare(a.ko||''));
function teamName(m, t){ return t === 'O' ? (m.opp || 'Opponent') : 'Leeds'; }

function refreshLists(){
  const players = new Set(), comps = new Set(['Premier League','Championship','League One','First Division','Second Division','FA Cup','League Cup','Play-off','UEFA Cup','Champions League','European Cup','Cup Winners\' Cup','Full Members\' Cup','Charity Shield','Pre-season friendly']), opps = new Set(), grounds = new Set(['Elland Road']);
  for(const m of db.matches){
    (m.lineup||[]).concat(m.bench||[]).forEach(p => p.name && players.add(p.name));
    (m.subs||[]).forEach(s => { if(s.t !== 'O'){ s.on && players.add(s.on); s.off && players.add(s.off); } });
    (m.goals||[]).forEach(g => g.t !== 'O' && g.type !== 'OG' && g.p && players.add(g.p));
    m.comp && comps.add(m.comp); m.opp && opps.add(m.opp); m.ground && grounds.add(m.ground);
  }
  const fill = (id, set) => $('#' + id).innerHTML = [...set].sort().map(v => `<option value="${esc(v)}">`).join('');
  fill('players', players); fill('comps', comps); fill('opps', opps); fill('grounds', grounds);
}

/* ---------- router ---------- */
let filt = { q:'', season:'', comp:'', venue:'' };
let curPath = (location.hash.slice(1) || '/');
function go(h){
  curPath = String(h).replace(/^#/, '') || '/';
  try { if(location.hash !== '#' + curPath) history.pushState(null, '', '#' + curPath); } catch(e){}
  route();
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if(!a) return;
  e.preventDefault(); go(a.getAttribute('href'));
});
function fromLocation(){ const h = location.hash.slice(1) || '/'; if(h !== curPath){ curPath = h; route(); } }
window.addEventListener('popstate', fromLocation);
function route(){
  const parts = curPath.split('/').filter(Boolean);
  const [view, id] = parts;
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === (view || 'list') || (view === 'edit' && a.dataset.t === 'new')));
  refreshLists();
  if(!view) listView();
  else if(view === 'match') detailView(id);
  else if(view === 'new') formView(null);
  else if(view === 'edit') formView(db.matches.find(m => m.id === id));
  else if(view === 'stats') statsView();
  else if(view === 'data') dataView();
  else listView();
  if(EPHEMERAL) app.insertAdjacentHTML('afterbegin', `<div class="banner">⚠️ Preview mode: this browser window isn't letting the page save, so anything you enter will vanish when you close it. Once it's on its own website, saving works normally.</div>`);
  try { window.scrollTo(0,0); } catch(e){}
}
window.addEventListener('hashchange', fromLocation);

/* ---------- list ---------- */
function listView(){
  const all = sorted();
  if(!all.length){
    app.innerHTML = `<div class="card empty"><div class="big">⚽</div><h2>No matches yet</h2><p class="muted">Add the first game you went to – from last weekend or from 1985, it all counts.</p><a class="btn" href="#/new">Add a match</a></div>`;
    return;
  }
  const seasons = [...new Set(all.map(m => seasonOf(m.date)))];
  const comps = [...new Set(all.map(m => m.comp).filter(Boolean))].sort();
  const last = db.meta.lastBackup ? new Date(db.meta.lastBackup) : null;
  const nudge = !last || (Date.now() - last) > 30*864e5;
  app.innerHTML = `
    ${nudge ? `<div class="banner">💾 ${last ? 'Last backup was over a month ago.' : 'Matches are saved on this device only.'} <a href="#/data">Back up now</a></div>` : ''}
    <div class="filters">
      <input id="fq" type="search" placeholder="Search opponent, player, ground…" value="${esc(filt.q)}">
      <select id="fs"><option value="">All seasons</option>${seasons.map(s => `<option ${s===filt.season?'selected':''}>${s}</option>`).join('')}</select>
      <select id="fc"><option value="">All competitions</option>${comps.map(s => `<option ${s===filt.comp?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <select id="fv"><option value="">Home &amp; away</option><option value="H" ${filt.venue==='H'?'selected':''}>Home</option><option value="A" ${filt.venue==='A'?'selected':''}>Away</option><option value="N" ${filt.venue==='N'?'selected':''}>Neutral</option></select>
    </div>
    <div id="mlist"></div>`;
  const draw = () => {
    const q = filt.q.toLowerCase();
    const ms = all.filter(m =>
      (!filt.season || seasonOf(m.date) === filt.season) && (!filt.comp || m.comp === filt.comp) && (!filt.venue || m.venue === filt.venue) &&
      (!q || JSON.stringify([m.opp,m.ground,m.comp,m.round,m.review,m.motm,m.with,m.lineup,m.bench,m.goals,m.subs]).toLowerCase().includes(q)));
    let html = '', cur = null;
    const bySeason = {};
    ms.forEach(m => { const s = seasonOf(m.date); (bySeason[s] = bySeason[s] || []).push(m); });
    for(const m of ms){
      const s = seasonOf(m.date);
      if(s !== cur){ cur = s; const g = bySeason[s]; const w = g.filter(x => res(x)==='W').length, d = g.filter(x => res(x)==='D').length, l = g.filter(x => res(x)==='L').length;
        html += `<div class="season">${s}<span>${g.length} game${g.length>1?'s':''} · W${w} D${d} L${l}</span></div>`; }
      const r = res(m);
      html += `<a class="m" href="#/match/${m.id}"><div class="badge ${r||''}">${r||'–'}</div><div class="mid"><div class="t">${esc(scoreTxt(m))}</div><div class="s">${fmtDate(m.date)} · ${esc([m.comp, m.ground || venueTxt(m.venue)].filter(Boolean).join(' · '))}${m.pens ? ' · pens' : m.et ? ' · aet' : ''}</div></div>${m.rating ? `<div class="rt">${esc(m.rating)}/10</div>` : ''}</a>`;
    }
    $('#mlist').innerHTML = html || `<p class="muted" style="text-align:center">No matches match those filters.</p>`;
  };
  $('#fq').oninput = e => { filt.q = e.target.value; draw(); };
  $('#fs').onchange = e => { filt.season = e.target.value; draw(); };
  $('#fc').onchange = e => { filt.comp = e.target.value; draw(); };
  $('#fv').onchange = e => { filt.venue = e.target.value; draw(); };
  draw();
}

/* ---------- detail ---------- */
function detailView(id){
  const m = db.matches.find(x => x.id === id);
  if(!m){ go('#/'); return; }
  const [a, b] = sides(m);
  const has = a.s !== '' && a.s != null && b.s !== '' && b.s != null;
  const ht = (m.htl !== '' && m.htl != null && m.hto !== '' && m.hto != null) ? (m.venue === 'A' ? `${m.hto}–${m.htl}` : `${m.htl}–${m.hto}`) : '';
  const ft90 = m.et && m.ftl !== '' && m.ftl != null && m.fto !== '' && m.fto != null ? (m.venue === 'A' ? `${m.fto}–${m.ftl}` : `${m.ftl}–${m.fto}`) : '';
  const notes = [ht && 'HT ' + ht, ft90 && '90 mins ' + ft90, m.et && 'After extra time', penNote(m)].filter(Boolean).join(' · ');

  const evs = [
    ...(m.goals||[]).map(g => ({min:g.min, t:g.t, html:`⚽ <div class="who"><b>${esc(g.p || 'Goal')}</b>${g.type ? ` <span class="sub">(${g.type === 'OG' ? 'own goal' : esc(g.type.toLowerCase())})</span>` : ''}${g.a ? `<div class="sub">Assist: ${esc(g.a)}</div>` : ''}</div>`})),
    ...(m.cards||[]).map(c => ({min:c.min, t:c.t, html:`${c.c === 'Yellow' ? '🟨' : c.c === '2nd yellow' ? '🟨🟥' : '🟥'} <div class="who">${esc(c.p || 'Card')}</div>`})),
    ...(m.subs||[]).map(s => ({min:s.min, t:s.t, html:`🔁 <div class="who"><b>${esc(s.on || '?')}</b><div class="sub">for ${esc(s.off || '?')}</div></div>`}))
  ].sort((x,y) => minVal(x.min) - minVal(y.min));

  const lineup = (m.lineup||[]).filter(p => p.name);
  const bench = (m.bench||[]).filter(p => p.name);
  const li = p => `<li><span class="n">${esc(p.n||'')}</span>${esc(p.name)}${p.cap ? '<span class="cap">C</span>' : ''}</li>`;
  const info = [['Competition', [m.comp, m.round].filter(Boolean).join(' – ')], ['Ground', m.ground], ['Kick-off', m.ko], ['Attendance', m.att && Number(m.att).toLocaleString('en-GB')], ['Referee', m.ref], ['Weather', m.weather]].filter(x => x[1]);

  app.innerHTML = `
    <div class="hero">
      <div class="meta">${fmtDate(m.date, true)} · ${esc(seasonOf(m.date))}</div>

function delMatch(id){

function dupMatch(id){

function fieldHTML([k,label,type,opts], r){
  const v = r[k] ?? '';
  if(type === 'chk') return `<label class="chk"><input type="checkbox" data-f="${k}" ${v ? 'checked' : ''}>${label}</label>`;
  if(type === 'team') return `<select data-f="${k}" class="w-team" aria-label="Team"><option value="L">Leeds</option><option value="O" ${v === 'O' ? 'selected' : ''}>Opp</option></select>`;
  if(type === 'sel') return `<select data-f="${k}" class="w-sel">${opts.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${o === '' ? 'Normal' : o === 'OG' ? 'Own goal' : o}</option>`).join('')}</select>`;
  return `<input data-f="${k}" data-txt="1" class="${type === 'txt' ? 'w-txt' : 'w-num'}" placeholder="${label}" aria-label="${label}" value="${esc(v)}" ${type === 'num' ? 'inputmode="numeric"' : ''} ${type === 'txt' ? 'list="players" autocapitalize="words" autocomplete="off"' : ''}>`;
}
function rowHTML(kind, r = {}){ return `<div class="row">${ROWDEF[kind].map(f => fieldHTML(f, r)).join('')}<button type="button" class="x" onclick="this.parentNode.remove()" aria-label="Remove">✕</button></div>`; }
function addRow(kind){ const box = $('#rows-' + kind); box.insertAdjacentHTML('beforeend', rowHTML(kind)); const inp = box.lastElementChild.querySelector('input'); inp && inp.focus(); }
function rowsBlock(kind, rows, addLabel){ return `<div id="rows-${kind}">${(rows||[]).map(r => rowHTML(kind, r)).join('')}</div><button type="button" class="add" onclick="addRow('${kind}')">+ ${addLabel}</button>`; }
function collectRows(kind){
  return [...document.querySelectorAll('#rows-' + kind + ' .row')].map(row => {
    const o = {}; let has = false;
    row.querySelectorAll('[data-f]').forEach(el => {
      o[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value.trim();
      if(el.dataset.txt && el.value.trim()) has = true;
    });
    return has ? o : null;
  }).filter(Boolean);
}

function calcScore(){

  if(f.et.checked){ const n = g.filter(x => minVal(x.min) < 91); f.ftl.value = n.filter(x => x.t !== 'O').length; f.fto.value = n.filter(x => x.t === 'O').length; }
}
function copyLineup(id){

/* ---------- stats ---------- */
function statsView(){
  const ms = db.matches;
  if(!ms.length){ app.innerHTML = `<div class="card empty"><div class="big">📊</div><p class="muted">Stats appear once you've added some matches.</p></div>`; return; }
  const r = {W:0,D:0,L:0}; let gf = 0, ga = 0, rated = 0, rsum = 0;
  const scorers = {}, apps = {}, opps = {}, grounds = {}, decades = {}, comps = {}, seasons = new Set(), ven = {H:0,A:0,N:0};
  let best = null, worst = null, topRated = null;
  for(const m of ms){
    const x = res(m); if(x) r[x]++;
    gf += num(m.ls) || 0; ga += num(m.os) || 0;
    seasons.add(seasonOf(m.date)); ven[m.venue] = (ven[m.venue] || 0) + 1;
    if(m.rating){ rated++; rsum += +m.rating; if(!topRated || +m.rating > +topRated.rating) topRated = m; }
    (m.goals||[]).forEach(g => { if(g.t !== 'O' && g.type !== 'OG' && g.p) scorers[g.p] = (scorers[g.p] || 0) + 1; });
    const seen = new Set(); (m.lineup||[]).forEach(p => p.name && seen.add(p.name)); (m.subs||[]).forEach(s => s.t !== 'O' && s.on && seen.add(s.on));
    seen.forEach(n => apps[n] = (apps[n] || 0) + 1);
    if(m.opp){ const o = opps[m.opp] = opps[m.opp] || {P:0,W:0,D:0,L:0}; o.P++; if(x) o[x]++; }
    if(m.ground) grounds[m.ground] = (grounds[m.ground] || 0) + 1;
    if(m.comp) comps[m.comp] = (comps[m.comp] || 0) + 1;
    if(m.date){ const d = Math.floor(+m.date.slice(0,4) / 10) * 10 + 's'; decades[d] = (decades[d] || 0) + 1; }
    if(x){ const diff = num(m.ls) - num(m.os);
      if(diff > 0 && (!best || diff > best.d || (diff === best.d && +m.ls > +best.m.ls))) best = {m, d:diff};
      if(diff < 0 && (!worst || diff < worst.d)) worst = {m, d:diff}; }
  }
  const P = r.W + r.D + r.L;
  const top = (o, n = 10) => Object.entries(o).sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, n);
  const rank = (rows, unit) => rows.length ? `<table class="rank">${rows.map(([k,v],i) => `<tr><td class="p">${i+1}</td><td>${esc(k)}</td><td class="n">${v}${unit ? ' ' + (v === 1 ? unit.replace(/s$/, '') : unit) : ''}</td></tr>`).join('')}</table>` : '<p class="muted small">Nothing recorded yet.</p>';
  const dmax = Math.max(...Object.values(decades), 1);
  const link = (m, lbl) => m ? `<a href="#/match/${m.id}" style="color:var(--blue)">${lbl}</a> <span class="muted small">${fmtDate(m.date)}</span>` : '–';
  app.innerHTML = `
    <h2>My Leeds record</h2>
    <div class="tiles">
      <div class="tile"><b>${ms.length}</b><span>Games</span></div>
      <div class="tile"><b>${seasons.size}</b><span>Seasons</span></div>
      <div class="tile"><b>${Object.keys(grounds).length}</b><span>Grounds</span></div>
      <div class="tile"><b>${gf}</b><span>Leeds goals</span></div>
      <div class="tile"><b>${ga}</b><span>Conceded</span></div>
      <div class="tile"><b>${P ? Math.round(r.W / P * 100) : 0}%</b><span>Win rate</span></div>
    </div>
    <div class="card"><h3>Won ${r.W} · Drawn ${r.D} · Lost ${r.L}</h3>
      <div class="wdl">${P ? `<i style="width:${r.W/P*100}%;background:var(--win)"></i><i style="width:${r.D/P*100}%;background:var(--draw)"></i><i style="width:${r.L/P*100}%;background:var(--loss)"></i>` : ''}</div>
      <p class="small muted" style="margin:6px 0 0">Home ${ven.H||0} · Away ${ven.A||0} · Neutral ${ven.N||0}${rated ? ` · Average rating ${(rsum/rated).toFixed(1)}/10` : ''}</p>
    </div>
    <div class="card"><h3>Highlights</h3><dl class="kv">
      <dt>Biggest win</dt><dd>${best ? link(best.m, esc(scoreTxt(best.m))) : '–'}</dd>
      <dt>Heaviest defeat</dt><dd>${worst ? link(worst.m, esc(scoreTxt(worst.m))) : '–'}</dd>
      <dt>Top-rated game</dt><dd>${topRated ? link(topRated, esc(scoreTxt(topRated)) + ' (' + esc(topRated.rating) + '/10)') : '–'}</dd>
      <dt>First game logged</dt><dd>${(() => { const f = [...ms].filter(m => m.date).sort((a,b) => a.date.localeCompare(b.date))[0]; return f ? link(f, esc(scoreTxt(f))) : '–'; })()}</dd>
    </dl></div>
    <div class="card"><h3>Goals I've seen – top scorers</h3>${rank(top(scorers), '')}</div>
    <div class="card"><h3>Players I've seen play most</h3>${rank(top(apps), 'games')}</div>
    <div class="card"><h3>Games by decade</h3>${Object.keys(decades).sort().map(d => `<div class="bar"><span class="lb">${d}</span><span class="tr"><i style="width:${decades[d]/dmax*100}%"></i></span><span class="v">${decades[d]}</span></div>`).join('')}</div>
    <div class="card"><h3>Opponents</h3>${Object.keys(opps).length ? `<table class="rank">${Object.entries(opps).sort((a,b) => b[1].P - a[1].P || a[0].localeCompare(b[0])).map(([k,o]) => `<tr><td>${esc(k)}</td><td class="n">${o.P} <span class="muted small" style="font-weight:400">W${o.W} D${o.D} L${o.L}</span></td></tr>`).join('')}</table>` : '<p class="muted small">–</p>'}</div>
    <div class="card"><h3>Grounds visited</h3>${rank(top(grounds, 999), '')}</div>
    <div class="card"><h3>Competitions</h3>${rank(top(comps, 999), '')}</div>`;
}

/* ---------- backup ---------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportJSON(){
  db.meta.lastBackup = new Date().toISOString(); save();
  download('leeds-matchday-log-' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(db, null, 2), 'application/json');
  dataView();
}
function exportCSV(){
  const cols = ['Date','Season','Competition','Round','Opponent','Venue','Ground','Leeds','Opp','HT','AET','Pens','Result','Leeds scorers','Attendance','Referee','Rating','MOTM','Review'];
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = sorted().reverse().map(m => [m.date, seasonOf(m.date), m.comp, m.round, m.opp, venueTxt(m.venue), m.ground, m.ls, m.os, (m.htl || m.hto) ? `${m.htl}-${m.hto}` : '', m.et ? 'Yes' : '', m.pens ? `${m.pl}-${m.po}` : '', res(m) || '',
    (m.goals||[]).filter(g => g.t !== 'O').map(g => `${g.p}${g.type === 'OG' ? ' (og)' : g.type === 'Pen' ? ' (pen)' : ''} ${minTxt(g.min)}`).join('; '), m.att, m.ref, m.rating, m.motm, m.review].map(q).join(','));
  download('leeds-matchday-log.csv', '﻿' + [cols.map(q).join(','), ...rows].join('\n'), 'text/csv');
}
function importJSON(input){
  const file = input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result); if(!d || !Array.isArray(d.matches)) throw new Error('Not a Matchday Log backup file');
      const replace = db.matches.length && confirm(`Backup has ${d.matches.length} matches.\n\nOK = REPLACE everything on this device with the backup\nCancel = MERGE (add any matches not already here)`);
      if(replace || !db.matches.length) db.matches = d.matches;
      else { const ids = new Set(db.matches.map(m => m.id)); d.matches.forEach(m => { if(!ids.has(m.id)) db.matches.push(m); else { const i = db.matches.findIndex(x => x.id === m.id); if((m.updated||'') > (db.matches[i].updated||'')) db.matches[i] = m; } }); }
      save(); alert('Done – ' + db.matches.length + ' matches on this device.'); go('#/');
    } catch(e){ alert('Could not read that file: ' + e.message); }
  };
  rd.readAsText(file);
}
function wipe(){
  if(prompt('This deletes ALL matches on this device. Type DELETE to confirm.') === 'DELETE'){ db = {matches:[], meta:{}}; save(); go('#/'); }
}

      <ul class="small" style="padding-left:18px">
        <li><b>Back up regularly.</b> If the browser data is cleared, or the phone is replaced, the backup file is how you get everything back.</li>
        <li><b>Phone and computer don't sync on their own.</b> To move matches across, export a backup on one and import it on the other.</li>
        <li><b>On iPhone:</b> tap Share → <i>Add to Home Screen</i> and always open it from there – Safari is less likely to clear its data.</li>
      </ul>
      <p class="small muted">${db.matches.length} matches stored · Last backup: ${last ? new Date(last).toLocaleString('en-GB') : 'never'}</p>
    </div>
    <div class="card"><h3>Back up</h3>
      <p class="small muted" style="margin-top:0">Saves a file with every match. Keep a copy somewhere safe – email it to yourself, or put it in Google Drive / iCloud.</p>
      <button onclick="exportJSON()">⬇️ Download backup file</button>
    </div>
    <div class="card"><h3>Restore / move to another device</h3>
      <p class="small muted" style="margin-top:0">Choose a backup file made by this site.</p>
      <input type="file" accept=".json,application/json" onchange="importJSON(this)">
    </div>
    <div class="card"><h3>Spreadsheet</h3>
      <p class="small muted" style="margin-top:0">A summary of every match to open in Excel or Google Sheets (for viewing – to restore, use the backup file above).</p>
      <button class="sec" onclick="exportCSV()">⬇️ Download spreadsheet (CSV)</button>
    </div>
    <div class="card"><h3>Danger zone</h3><button class="danger" onclick="wipe()">Delete all matches on this device</button></div>`;
}

route();
</script>
</body>
</html>
