<!DOCTYPE html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080F1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchday Log">
<title>Matchday Log – Leeds United</title>
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* Apply the saved appearance before first paint (no flash of the wrong theme). Dark by default. */
(function(){ try {
  var p = localStorage.getItem('mdl-theme') || 'dark';
  var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
  document.documentElement.dataset.theme = t;
  if(t === 'light') document.querySelector('meta[name="theme-color"]').content = '#F3F6FA';
} catch(e){} })();
</script>
<link rel="preconnect" href="https://a.espncdn.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="preload" as="image" href="assets/img/stadium-900.webp" media="(max-width: 899px)">
<script type="module" src="js/app.js"></script>
</head>
<body>
<main id="app" tabindex="-1"></main>
<noscript><p style="padding:24px">Matchday Log needs JavaScript switched on.</p></noscript>
</body>
</html>
